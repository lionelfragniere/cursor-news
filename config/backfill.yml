# Public archive indexes. Dates in templates are expanded with strftime.
# Only dated, public article metadata is stored; no paywall bypass or audio generation.
archives:
  - source: Canal9 - Actualités
    kind: wordpress
    url: https://canal9.ch/wp-json/wp/v2/posts
  - source: Le Temps - Actualités
    kind: html
    hosts: [www.letemps.ch]
    urls: ["https://www.letemps.ch/archive/%Y%m"]
    selector: a.lt-page-archives__link
    article_pattern: '^/(?!archive)[^/]+/.+'
  - source: RTN - Région
    kind: radio
    base: https://www.rtn.ch
    hosts: [www.rtn.ch]
    article_path: /rtn/Actualite/Region/
    article_pattern: '^/rtn/Actualite/Region/20[0-9]{6}'
  - source: RJB - Région
    kind: radio
    base: https://www.rjb.ch
    hosts: [www.rjb.ch]
    article_path: /rjb/Actualite/Region/
    article_pattern: '^/rjb/Actualite/Region/20[0-9]{6}'
  - source: RFJ - Région
    kind: radio
    base: https://www.rfj.ch
    hosts: [www.rfj.ch]
    article_path: /rfj/Actualite/Region/
    article_pattern: '^/rfj/Actualite/Region/20[0-9]{6}'
  - source: Franceinfo - Titres
    kind: sitemap
    hosts: [www.franceinfo.fr]
    urls: ["https://www.franceinfo.fr/sitemap/%Y-%m-article.xml", "https://www.franceinfo.fr/sitemap/%Y-%m-video.xml"]
    article_pattern: '\.html$'
  - source: Le Monde - En continu
    kind: html
    hosts: [www.lemonde.fr]
    urls: ["https://www.lemonde.fr/archives-du-monde/%d-%m-%Y/"]
    article_pattern: '/(?:article|live)/20[0-9]{2}/'
  - source: France 24 - Français
    kind: html
    hosts: [www.france24.com]
    urls: ["https://www.france24.com/fr/archives/%Y/%m/"]
    pagination: true
    article_pattern: '^/fr/.*20[0-9]{6}-'
  - source: RFI - Français
    kind: html
    hosts: [www.rfi.fr]
    urls: ["https://www.rfi.fr/fr/archives/%Y/%m/"]
    pagination: true
    article_pattern: '^/fr/.*20[0-9]{6}-'
  - source: Euronews - Français
    kind: sitemap
    hosts: [fr.euronews.com]
    urls: ["https://fr.euronews.com/sitemap/articles-%Y-%m.xml"]
    article_pattern: '/20[0-9]{2}/[0-9]{2}/[0-9]{2}/'
  - source: UN News - Top Stories
    kind: sitemap
    hosts: [news.un.org]
    urls: [https://news.un.org/en/sitemap.xml]
    article_pattern: '^/en/story/20[0-9]{2}/'
  - source: BBC News - Top Stories
    kind: sitemap
    hosts: [www.bbc.com, www.bbc.co.uk]
    urls: [https://www.bbc.com/sitemaps/https-index-com-news.xml]
    article_pattern: '^/news/(?:articles|world|uk|business|science|health|technology)'
  - source: The Guardian - World
    kind: html
    hosts: [www.theguardian.com]
    urls: ["https://www.theguardian.com/world/%Y/%b/%d/all"]
    article_pattern: '^/world/20[0-9]{2}/[a-zA-Z]{3}/[0-9]{2}/(?!all)'
  - source: NPR - News
    kind: sitemap
    hosts: [www.npr.org]
    urls: [https://googlecrawl.npr.org/standard/sitemap_index.xml]
    article_pattern: '^/20[0-9]{2}/'
  - source: Al Jazeera - English
    kind: sitemap
    hosts: [www.aljazeera.com]
    urls: ["https://www.aljazeera.com/sitemaps/article-new/%d-%m-%Y.xml"]
    article_pattern: '^/(?:news|economy|features|opinions|sports)/'
  - source: DW - English
    kind: sitemap
    hosts: [www.dw.com]
    urls: [https://www.dw.com/en/article-sitemap.xml]
    article_pattern: '^/en/.+/a-'
  - source: France 24 - English
    kind: html
    hosts: [www.france24.com]
    urls: ["https://www.france24.com/en/archives/%Y/%m/"]
    pagination: true
    article_pattern: '^/en/.*20[0-9]{6}-'
  - source: Euronews - English
    kind: sitemap
    hosts: [www.euronews.com]
    urls: ["https://www.euronews.com/sitemap/articles-%Y-%m.xml"]
    article_pattern: '/20[0-9]{2}/[0-9]{2}/[0-9]{2}/'
